name: Build and Deploy Angular App

on:
  push:
    branches: [ develop ]   # ← keep your branch

permissions:
  contents: write            # needed by peaceiris to push to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4          # ← fixed (was v6, doesn't exist)

      - name: Setup Node.js
        uses: actions/setup-node@v4        # ← fixed (was v6, doesn't exist)
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci                         # ← fixed (was npm install)

      - name: Build
        run: npm run github-build

      - name: Add .nojekyll                        # ← Fix 2: stops Jekyll eating your files
        run: touch ./dist/tParity-UI/browser/.nojekyll

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4   # ← fixed (was v3, deprecated)
        with:
          name: dist
          path: dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4   # ← removed duplicate npm deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/tParity-UI/browser
          enable_jekyll: false
