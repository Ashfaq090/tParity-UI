name: Build Angular App

on: 
  push:
    branches: [ develop ]

jobs: 
  build-angular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node Js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
      
      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Angular Deploy gh-pages
        uses: AhsanAyaz/angular-deploy-gh-pages-actions@v1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          angular_project_dir: ./dist/tParity-UI/browser
