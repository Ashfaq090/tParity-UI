name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ develop ]       # change to 'develop' if that's your branch

permissions:
  contents: write            # allows peaceiris to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npx ng build --configuration production

      - name: Add .nojekyll file
        run: touch dist/tParity-UI/browser/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/tParity-UI/browser
          enable_jekyll: false
