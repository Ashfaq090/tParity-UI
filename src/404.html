<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Save the URL the user was trying to reach
      sessionStorage.setItem('redirect', location.pathname + location.search);
      // Send them to your app root
      location.replace('/tParity-UI/');
    </script>
  </head>
  <body></body>
</html>
